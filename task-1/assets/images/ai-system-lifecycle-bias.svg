<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="700" viewBox="0 0 1000 700" role="img" aria-labelledby="title desc" font-family="Helvetica, Arial, sans-serif">
  <title id="title">Where bias can enter during the life cycle of an AI system</title>
  <desc id="desc">A cycle of seven stages: 1 problem definition, 2 data collection, 3 labeling, 4 training, 5 testing, 6 deployment, 7 feedback and monitoring, which leads back to problem definition. A coral callout at each stage names a way bias can enter: a wrong proxy target, unrepresentative data, biased labels, the model learning unfair patterns and ignoring small groups, a test set missing groups, use on a different population, and feedback loops that reinforce earlier bias.</desc>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1f3a5f"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1000" height="700" fill="#ffffff"/>

  <text x="30" y="40" font-size="24" font-weight="bold" fill="#1f3a5f">Where bias can enter an AI system</text>
  <text x="30" y="64" font-size="15" fill="#1f3a5f">Bias can creep in at every stage of the life cycle, not only through the data.</text>

  <!-- ===== Bias callouts (top row) ===== -->
  <g font-size="14" fill="#1f3a5f">
    <rect x="30" y="86" width="220" height="100" rx="8" fill="#fbe9e3" stroke="#e76f51" stroke-width="2"/>
    <text x="44" y="108" font-size="15" font-weight="bold" fill="#c4472a">Wrong proxy target</text>
    <text x="44" y="130">Predicting something easy</text>
    <text x="44" y="148">to measure (e.g. past cost)</text>
    <text x="44" y="166">instead of the real need</text>

    <rect x="270" y="86" width="220" height="100" rx="8" fill="#fbe9e3" stroke="#e76f51" stroke-width="2"/>
    <text x="284" y="108" font-size="15" font-weight="bold" fill="#c4472a">Unrepresentative data</text>
    <text x="284" y="130">Some groups are missing,</text>
    <text x="284" y="148">too few, or shown in a</text>
    <text x="284" y="166">one-sided way</text>

    <rect x="510" y="86" width="220" height="100" rx="8" fill="#fbe9e3" stroke="#e76f51" stroke-width="2"/>
    <text x="524" y="108" font-size="15" font-weight="bold" fill="#c4472a">Biased labels</text>
    <text x="524" y="130">The "answers" come from</text>
    <text x="524" y="148">human judgments that may</text>
    <text x="524" y="166">carry human prejudice</text>

    <rect x="750" y="86" width="220" height="100" rx="8" fill="#fbe9e3" stroke="#e76f51" stroke-width="2"/>
    <text x="764" y="108" font-size="15" font-weight="bold" fill="#c4472a">Learning unfair patterns</text>
    <text x="764" y="130">The model copies patterns</text>
    <text x="764" y="148">in the data, unfair ones too;</text>
    <text x="764" y="166">small groups can be ignored</text>
  </g>

  <!-- ===== Bias callouts (bottom row) ===== -->
  <g font-size="14" fill="#1f3a5f">
    <rect x="270" y="526" width="220" height="100" rx="8" fill="#fbe9e3" stroke="#e76f51" stroke-width="2"/>
    <text x="284" y="548" font-size="15" font-weight="bold" fill="#c4472a">Feedback loops</text>
    <text x="284" y="570">Biased outputs shape the</text>
    <text x="284" y="588">new data, which then trains</text>
    <text x="284" y="606">the next model; bias can grow</text>

    <rect x="510" y="526" width="220" height="100" rx="8" fill="#fbe9e3" stroke="#e76f51" stroke-width="2"/>
    <text x="524" y="548" font-size="15" font-weight="bold" fill="#c4472a">Different population</text>
    <text x="524" y="570">Used on people or places</text>
    <text x="524" y="588">unlike those in the</text>
    <text x="524" y="606">training data</text>

    <rect x="750" y="526" width="220" height="100" rx="8" fill="#fbe9e3" stroke="#e76f51" stroke-width="2"/>
    <text x="764" y="548" font-size="15" font-weight="bold" fill="#c4472a">Test set missing groups</text>
    <text x="764" y="570">A high average score can</text>
    <text x="764" y="588">hide poor results for</text>
    <text x="764" y="606">some groups of people</text>
  </g>

  <!-- Callout connectors -->
  <g stroke="#e76f51" stroke-width="2" stroke-dasharray="4 3">
    <line x1="140" y1="186" x2="140" y2="206"/>
    <line x1="380" y1="186" x2="380" y2="206"/>
    <line x1="620" y1="186" x2="620" y2="206"/>
    <line x1="860" y1="186" x2="860" y2="206"/>
    <line x1="380" y1="506" x2="380" y2="526"/>
    <line x1="620" y1="506" x2="620" y2="526"/>
    <line x1="860" y1="506" x2="860" y2="526"/>
  </g>

  <!-- ===== Stages ===== -->
  <g font-size="14" fill="#1f3a5f" text-anchor="middle">
    <rect x="40" y="206" width="200" height="60" rx="10" fill="#d4eeea" stroke="#2a9d8f" stroke-width="2.5"/>
    <text x="140" y="231" font-size="15" font-weight="bold">1. Problem definition</text>
    <text x="140" y="252">What should it predict?</text>

    <rect x="280" y="206" width="200" height="60" rx="10" fill="#d4eeea" stroke="#2a9d8f" stroke-width="2.5"/>
    <text x="380" y="231" font-size="15" font-weight="bold">2. Data collection</text>
    <text x="380" y="252">Gather examples</text>

    <rect x="520" y="206" width="200" height="60" rx="10" fill="#d4eeea" stroke="#2a9d8f" stroke-width="2.5"/>
    <text x="620" y="231" font-size="15" font-weight="bold">3. Labeling</text>
    <text x="620" y="252">Add the "answers"</text>

    <rect x="760" y="206" width="200" height="60" rx="10" fill="#d4eeea" stroke="#2a9d8f" stroke-width="2.5"/>
    <text x="860" y="231" font-size="15" font-weight="bold">4. Training</text>
    <text x="860" y="252">Model learns patterns</text>

    <rect x="760" y="446" width="200" height="60" rx="10" fill="#d4eeea" stroke="#2a9d8f" stroke-width="2.5"/>
    <text x="860" y="471" font-size="15" font-weight="bold">5. Testing</text>
    <text x="860" y="492">Check how well it works</text>

    <rect x="520" y="446" width="200" height="60" rx="10" fill="#d4eeea" stroke="#2a9d8f" stroke-width="2.5"/>
    <text x="620" y="471" font-size="15" font-weight="bold">6. Deployment</text>
    <text x="620" y="492">Used in the real world</text>

    <rect x="280" y="446" width="200" height="60" rx="10" fill="#d4eeea" stroke="#2a9d8f" stroke-width="2.5"/>
    <text x="380" y="471" font-size="15" font-weight="bold">7. Feedback &amp; monitoring</text>
    <text x="380" y="492">Watch results, update</text>
  </g>

  <!-- Cycle arrows -->
  <g stroke="#1f3a5f" stroke-width="2.5" fill="none" marker-end="url(#arr)">
    <line x1="240" y1="236" x2="278" y2="236"/>
    <line x1="480" y1="236" x2="518" y2="236"/>
    <line x1="720" y1="236" x2="758" y2="236"/>
    <line x1="860" y1="266" x2="860" y2="444"/>
    <line x1="760" y1="476" x2="722" y2="476"/>
    <line x1="520" y1="476" x2="482" y2="476"/>
    <path d="M280,476 L140,476 L140,268"/>
  </g>

  <!-- Centre label -->
  <text x="500" y="350" font-size="22" font-weight="bold" fill="#8a9bb0" text-anchor="middle">AI system life cycle</text>
  <text x="500" y="376" font-size="15" fill="#8a9bb0" text-anchor="middle">(it keeps going round)</text>
  <text x="152" y="370" font-size="14" fill="#1f3a5f">repeat</text>

  <!-- Legend / footer -->
  <rect x="30" y="526" width="220" height="100" rx="8" fill="#f4f4f4" stroke="#1f3a5f" stroke-width="1.5"/>
  <rect x="44" y="542" width="22" height="16" rx="3" fill="#d4eeea" stroke="#2a9d8f" stroke-width="2"/>
  <text x="74" y="555" font-size="14" fill="#1f3a5f">stage of the life cycle</text>
  <rect x="44" y="572" width="22" height="16" rx="3" fill="#fbe9e3" stroke="#e76f51" stroke-width="2"/>
  <text x="74" y="585" font-size="14" fill="#1f3a5f">where bias can enter</text>
  <text x="44" y="612" font-size="14" fill="#1f3a5f" font-style="italic">bias = systematic unfairness</text>

  <text x="30" y="668" font-size="15" fill="#1f3a5f"><tspan font-weight="bold">Key idea:</tspan> people make choices at every stage, so checking for bias is needed at every stage, not just once.</text>
</svg>
