<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="740" viewBox="0 0 1000 740" role="img" aria-labelledby="title desc" font-family="Helvetica, Arial, sans-serif">
  <title id="title">State graph of the farmer, wolf, goat and cabbage river-crossing puzzle</title>
  <desc id="desc">Each state is written as left bank | right bank, with F farmer, W wolf, G goat, C cabbage. From the start FWGC | the only safe first move is to take the goat: WC | FG. Then the farmer returns alone: FWC | G. Here the path splits. Solution A takes the wolf (C | FWG), brings the goat back (FGC | W), takes the cabbage (G | FWC). Solution B takes the cabbage (W | FGC), brings the goat back (FWG | C), takes the wolf (G | FWC). Both then return alone (FG | WC) and take the goat to reach the goal | FWGC. Each solution takes 7 crossings. Unsafe states shown in coral include GC | FW (goat eats cabbage) and WG | FC (wolf eats goat). A breadth-first search finds 10 safe states and these two shortest solutions.</desc>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1f3a5f"/>
    </marker>
    <marker id="arrT" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2a9d8f"/>
    </marker>
    <marker id="arrA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#c9a227"/>
    </marker>
    <marker id="arrC" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#e76f51"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1000" height="740" fill="#ffffff"/>

  <text x="30" y="40" font-size="24" font-weight="bold" fill="#1f3a5f">River-crossing puzzle as a search problem</text>
  <text x="30" y="64" font-size="15" fill="#1f3a5f">Each box is a state (left bank | right bank). Each arrow is one boat crossing.</text>

  <!-- ===== Edges ===== -->
  <!-- invalid first moves -->
  <g stroke="#e76f51" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrC)">
    <line x1="265" y1="110" x2="153" y2="110"/>
    <line x1="395" y1="110" x2="507" y2="110"/>
  </g>
  <!-- shared steps -->
  <g stroke="#1f3a5f" stroke-width="2.5" marker-end="url(#arr)">
    <line x1="330" y1="132" x2="330" y2="166"/>
    <line x1="330" y1="212" x2="330" y2="246"/>
    <line x1="330" y1="532" x2="330" y2="566"/>
    <line x1="330" y1="612" x2="330" y2="646"/>
  </g>
  <!-- solution A (wolf first) -->
  <g stroke="#2a9d8f" stroke-width="2.5" marker-end="url(#arrT)">
    <line x1="300" y1="292" x2="198" y2="326"/>
    <line x1="180" y1="372" x2="180" y2="406"/>
    <line x1="198" y1="452" x2="300" y2="486"/>
  </g>
  <!-- solution B (cabbage first) -->
  <g stroke="#c9a227" stroke-width="2.5" marker-end="url(#arrA)">
    <line x1="360" y1="292" x2="462" y2="326"/>
    <line x1="480" y1="372" x2="480" y2="406"/>
    <line x1="462" y1="452" x2="360" y2="486"/>
  </g>

  <!-- ===== Edge labels ===== -->
  <g font-size="14" fill="#1f3a5f">
    <text x="208" y="102" text-anchor="middle" fill="#c4472a">take wolf</text>
    <text x="451" y="102" text-anchor="middle" fill="#c4472a">take cabbage</text>
    <text x="342" y="155">1. take goat →</text>
    <text x="342" y="235">2. return alone ←</text>
    <text x="236" y="310" text-anchor="end">3. take wolf →</text>
    <text x="426" y="310">3. take cabbage →</text>
    <text x="170" y="395" text-anchor="end">4. bring goat back ←</text>
    <text x="490" y="395">4. bring goat back ←</text>
    <text x="242" y="476" text-anchor="end">5. take cabbage →</text>
    <text x="420" y="476">5. take wolf →</text>
    <text x="342" y="555">6. return alone ←</text>
    <text x="342" y="635">7. take goat →</text>
  </g>

  <!-- ===== Nodes ===== -->
  <g font-size="17" font-weight="bold" text-anchor="middle">
    <!-- start -->
    <text x="330" y="83" font-size="14" fill="#2a9d8f">START</text>
    <rect x="265" y="88" width="130" height="44" rx="8" fill="#2a9d8f"/>
    <text x="330" y="116" fill="#ffffff">FWGC |</text>

    <!-- invalid examples -->
    <rect x="30" y="88" width="120" height="44" rx="8" fill="#f6d0c4" stroke="#e76f51" stroke-width="2.5" stroke-dasharray="6 4"/>
    <text x="90" y="116" fill="#1f3a5f">GC | FW</text>
    <text x="90" y="152" font-size="14" font-weight="normal" fill="#c4472a">✗ goat eats cabbage</text>
    <rect x="510" y="88" width="120" height="44" rx="8" fill="#f6d0c4" stroke="#e76f51" stroke-width="2.5" stroke-dasharray="6 4"/>
    <text x="570" y="116" fill="#1f3a5f">WG | FC</text>
    <text x="570" y="152" font-size="14" font-weight="normal" fill="#c4472a">✗ wolf eats goat</text>

    <!-- shared states -->
    <rect x="265" y="168" width="130" height="44" rx="8" fill="#ffffff" stroke="#1f3a5f" stroke-width="2.5"/>
    <text x="330" y="196" fill="#1f3a5f">WC | FG</text>
    <rect x="265" y="248" width="130" height="44" rx="8" fill="#ffffff" stroke="#1f3a5f" stroke-width="2.5"/>
    <text x="330" y="276" fill="#1f3a5f">FWC | G</text>

    <!-- solution A states -->
    <rect x="115" y="328" width="130" height="44" rx="8" fill="#d4eeea" stroke="#2a9d8f" stroke-width="2.5"/>
    <text x="180" y="356" fill="#1f3a5f">C | FWG</text>
    <rect x="115" y="408" width="130" height="44" rx="8" fill="#d4eeea" stroke="#2a9d8f" stroke-width="2.5"/>
    <text x="180" y="436" fill="#1f3a5f">FGC | W</text>

    <!-- solution B states -->
    <rect x="415" y="328" width="130" height="44" rx="8" fill="#f8ebc4" stroke="#c9a227" stroke-width="2.5"/>
    <text x="480" y="356" fill="#1f3a5f">W | FGC</text>
    <rect x="415" y="408" width="130" height="44" rx="8" fill="#f8ebc4" stroke="#c9a227" stroke-width="2.5"/>
    <text x="480" y="436" fill="#1f3a5f">FWG | C</text>

    <!-- shared states -->
    <rect x="265" y="488" width="130" height="44" rx="8" fill="#ffffff" stroke="#1f3a5f" stroke-width="2.5"/>
    <text x="330" y="516" fill="#1f3a5f">G | FWC</text>
    <rect x="265" y="568" width="130" height="44" rx="8" fill="#ffffff" stroke="#1f3a5f" stroke-width="2.5"/>
    <text x="330" y="596" fill="#1f3a5f">FG | WC</text>

    <!-- goal -->
    <rect x="265" y="648" width="130" height="44" rx="8" fill="#2a9d8f"/>
    <text x="330" y="676" fill="#ffffff">| FWGC</text>
    <text x="255" y="676" font-size="14" fill="#2a9d8f" text-anchor="end">GOAL</text>
  </g>

  <!-- ===== Right-hand explanation panel ===== -->
  <g font-size="14" fill="#1f3a5f">
    <rect x="660" y="88" width="320" height="136" rx="10" fill="#f4f4f4" stroke="#1f3a5f" stroke-width="1.5"/>
    <text x="676" y="112" font-size="16" font-weight="bold">How to read a state</text>
    <text x="676" y="136">F = farmer, W = wolf,</text>
    <text x="676" y="155">G = goat, C = cabbage</text>
    <text x="676" y="174">Written as: left bank | right bank</text>
    <text x="676" y="193">e.g. WC | FG = wolf and cabbage left;</text>
    <text x="676" y="212">farmer and goat on the right bank.</text>

    <rect x="660" y="236" width="320" height="118" rx="10" fill="#f4f4f4" stroke="#1f3a5f" stroke-width="1.5"/>
    <text x="676" y="260" font-size="16" font-weight="bold">Rules</text>
    <text x="676" y="284">The boat carries the farmer plus</text>
    <text x="676" y="303">at most one passenger.</text>
    <text x="676" y="322">Never leave wolf + goat, or</text>
    <text x="676" y="341">goat + cabbage, without the farmer.</text>

    <rect x="660" y="366" width="320" height="124" rx="10" fill="#fbe9e3" stroke="#e76f51" stroke-width="2"/>
    <text x="676" y="390" font-size="16" font-weight="bold" fill="#c4472a">Unsafe states (not allowed)</text>
    <text x="676" y="414"><tspan font-weight="bold">WG | FC</tspan>: wolf eats goat</text>
    <text x="676" y="433"><tspan font-weight="bold">GC | FW</tspan>: goat eats cabbage</text>
    <text x="676" y="452"><tspan font-weight="bold">WGC | F</tspan>: both problems at once</text>
    <text x="676" y="476" font-style="italic">6 of the 16 possible states are unsafe.</text>

    <rect x="660" y="502" width="320" height="190" rx="10" fill="#f4f4f4" stroke="#1f3a5f" stroke-width="1.5"/>
    <text x="676" y="526" font-size="16" font-weight="bold">What a breadth-first search finds</text>
    <line x1="678" y1="547" x2="718" y2="547" stroke="#1f3a5f" stroke-width="3"/>
    <text x="728" y="552">steps shared by both solutions</text>
    <line x1="678" y1="572" x2="718" y2="572" stroke="#2a9d8f" stroke-width="3"/>
    <text x="728" y="577">Solution A: wolf first</text>
    <line x1="678" y1="597" x2="718" y2="597" stroke="#c9a227" stroke-width="3"/>
    <text x="728" y="602">Solution B: cabbage first</text>
    <text x="676" y="630">10 safe states in total. Both solutions</text>
    <text x="676" y="649">take 7 crossings, the minimum</text>
    <text x="676" y="668">possible; no shorter path exists.</text>
  </g>

  <text x="30" y="722" font-size="14" fill="#1f3a5f">→ = crossing to the right bank; ← = crossing back to the left bank. The farmer is always in the boat.</text>
</svg>
