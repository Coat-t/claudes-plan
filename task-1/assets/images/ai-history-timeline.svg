<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="630" viewBox="0 0 1000 630" role="img" aria-labelledby="title desc" font-family="Helvetica, Arial, sans-serif">
  <title id="title">Timeline of AI history, 1950 to 2025</title>
  <desc id="desc">A horizontal timeline from 1950 to 2025. Milestones: 1950 Turing's paper "Computing Machinery and Intelligence" proposes the imitation game (Turing test); 1956 Dartmouth workshop names AI as a field; 1958 Rosenblatt's perceptron; 1966 ELIZA chatbot; about 1974 to 1980 the first AI winter (shaded); 1980s expert systems boom; about 1987 to 1993 the second AI winter (shaded); 1997 Deep Blue beats chess champion Garry Kasparov; 2012 AlexNet wins the ImageNet challenge; 2016 AlphaGo beats Go champion Lee Sedol; 2017 the Transformer architecture; 2022 ChatGPT is released. Winter dates are approximate.</desc>
  <rect x="0" y="0" width="1000" height="630" fill="#ffffff"/>

  <text x="30" y="40" font-size="24" font-weight="bold" fill="#1f3a5f">A short history of AI, 1950–2025</text>
  <text x="30" y="64" font-size="15" fill="#1f3a5f">Scale: 12 pixels = 1 year. Shaded bands are "AI winters": periods of reduced funding and interest.</text>

  <!-- AI winters (x = 60 + (year - 1950) * 12) -->
  <rect x="348" y="252" width="72" height="140" fill="#dfe7f1"/>
  <rect x="504" y="252" width="72" height="140" fill="#dfe7f1"/>
  <g font-size="14" font-weight="bold" fill="#1f3a5f" text-anchor="middle">
    <text x="384" y="270">1st AI</text>
    <text x="384" y="287">winter</text>
    <text x="384" y="304" font-weight="normal">~1974–80</text>
    <text x="540" y="270">2nd AI</text>
    <text x="540" y="287">winter</text>
    <text x="540" y="304" font-weight="normal">~1987–93</text>
  </g>

  <!-- Axis -->
  <line x1="60" y1="330" x2="960" y2="330" stroke="#1f3a5f" stroke-width="3"/>
  <g stroke="#1f3a5f" stroke-width="2">
    <line x1="60" y1="324" x2="60" y2="336"/>
    <line x1="180" y1="324" x2="180" y2="336"/>
    <line x1="300" y1="324" x2="300" y2="336"/>
    <line x1="420" y1="324" x2="420" y2="336"/>
    <line x1="540" y1="324" x2="540" y2="336"/>
    <line x1="660" y1="324" x2="660" y2="336"/>
    <line x1="780" y1="324" x2="780" y2="336"/>
    <line x1="900" y1="324" x2="900" y2="336"/>
    <line x1="960" y1="324" x2="960" y2="336"/>
  </g>
  <g font-size="14" fill="#1f3a5f" text-anchor="middle">
    <text x="60" y="354">1950</text>
    <text x="180" y="354">1960</text>
    <text x="300" y="354">1970</text>
    <text x="420" y="354">1980</text>
    <text x="540" y="354">1990</text>
    <text x="660" y="354">2000</text>
    <text x="780" y="354">2010</text>
    <text x="900" y="354">2020</text>
    <text x="960" y="354">2025</text>
  </g>

  <!-- Expert systems boom (1980s), amber segment on the axis -->
  <rect x="420" y="322" width="84" height="16" rx="4" fill="#e9c46a" stroke="#c9a227" stroke-width="1.5"/>

  <!-- Leader lines -->
  <g stroke="#1f3a5f" stroke-width="1.5">
    <line x1="60" y1="330" x2="60" y2="120"/>     <!-- 1950 -->
    <line x1="156" y1="330" x2="156" y2="240"/>   <!-- 1958 -->
    <line x1="462" y1="322" x2="462" y2="180"/>   <!-- 1980s -->
    <line x1="804" y1="330" x2="804" y2="240"/>   <!-- 2012 -->
    <line x1="864" y1="330" x2="864" y2="120"/>   <!-- 2017 -->
    <line x1="132" y1="330" x2="132" y2="474"/>   <!-- 1956 -->
    <line x1="252" y1="330" x2="252" y2="414"/>   <!-- 1966 -->
    <line x1="624" y1="330" x2="624" y2="474"/>   <!-- 1997 -->
    <line x1="852" y1="330" x2="852" y2="414"/>   <!-- 2016 -->
    <line x1="924" y1="330" x2="924" y2="474"/>   <!-- 2022 -->
  </g>

  <!-- Event dots -->
  <g fill="#2a9d8f" stroke="#ffffff" stroke-width="2">
    <circle cx="60" cy="330" r="7"/>
    <circle cx="132" cy="330" r="7"/>
    <circle cx="156" cy="330" r="7"/>
    <circle cx="252" cy="330" r="7"/>
    <circle cx="624" cy="330" r="7"/>
    <circle cx="804" cy="330" r="7"/>
    <circle cx="852" cy="330" r="7"/>
    <circle cx="864" cy="330" r="7"/>
    <circle cx="924" cy="330" r="7"/>
  </g>

  <!-- Labels above the axis -->
  <g font-size="14" fill="#1f3a5f">
    <text x="54" y="96" font-size="15" font-weight="bold">1950 Turing's paper</text>
    <text x="54" y="114">"Can machines think?" (Turing test)</text>

    <text x="150" y="216" font-size="15" font-weight="bold">1958 Perceptron</text>
    <text x="150" y="234">early learning "neuron" (Rosenblatt)</text>

    <text x="462" y="156" font-size="15" font-weight="bold" text-anchor="middle">1980s Expert systems boom</text>
    <text x="462" y="174" text-anchor="middle">hand-written rules for business</text>

    <text x="810" y="216" font-size="15" font-weight="bold" text-anchor="end">2012 AlexNet wins ImageNet</text>
    <text x="810" y="234" text-anchor="end">deep learning takes off</text>

    <text x="960" y="96" font-size="15" font-weight="bold" text-anchor="end">2017 Transformer</text>
    <text x="960" y="114" text-anchor="end">design behind today's chatbots</text>
  </g>

  <!-- Labels below the axis -->
  <g font-size="14" fill="#1f3a5f">
    <text x="126" y="492" font-size="15" font-weight="bold">1956 Dartmouth workshop</text>
    <text x="126" y="510">AI launched as a research field</text>

    <text x="246" y="432" font-size="15" font-weight="bold">1966 ELIZA</text>
    <text x="246" y="450">early chatbot (Weizenbaum)</text>

    <text x="624" y="492" font-size="15" font-weight="bold" text-anchor="middle">1997 Deep Blue</text>
    <text x="624" y="510" text-anchor="middle">beats chess champion Kasparov</text>

    <text x="858" y="432" font-size="15" font-weight="bold" text-anchor="end">2016 AlphaGo</text>
    <text x="858" y="450" text-anchor="end">beats Go champion Lee Sedol</text>

    <text x="960" y="492" font-size="15" font-weight="bold" text-anchor="end">2022 ChatGPT</text>
    <text x="960" y="510" text-anchor="end">chatbots go mainstream</text>
  </g>

  <!-- Era labels and footnote -->
  <rect x="30" y="548" width="940" height="60" rx="10" fill="#f4f4f4" stroke="#1f3a5f" stroke-width="1.5"/>
  <text x="50" y="573" font-size="15" fill="#1f3a5f"><tspan font-weight="bold">Note:</tspan> winter dates are approximate; historians date them slightly differently.</text>
  <text x="50" y="595" font-size="15" fill="#1f3a5f">The comeback after 2010 came from more data, faster computers (GPUs) and better algorithms.</text>
</svg>
