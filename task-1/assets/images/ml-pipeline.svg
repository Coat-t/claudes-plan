<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="540" viewBox="0 0 1000 540" role="img" aria-labelledby="title desc" font-family="Helvetica, Arial, sans-serif">
  <title id="title">The machine learning pipeline: training phase and inference phase</title>
  <desc id="desc">Training phase: 1 collect data, 2 prepare features and labels, 3 train with a learning algorithm, 4 the result is a model, 5 test and evaluate it on unseen test data. If results are poor, loop back, improve the data or settings and train again. If results are good enough, deploy the model. Inference phase: a new input goes into the trained model, which outputs a prediction.</desc>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1f3a5f"/>
    </marker>
    <marker id="arrC" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#e76f51"/>
    </marker>
    <marker id="arrT" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2a9d8f"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1000" height="540" fill="#ffffff"/>

  <text x="30" y="34" font-size="24" font-weight="bold" fill="#1f3a5f">From data to predictions: the machine learning pipeline</text>

  <!-- ===== Training phase band ===== -->
  <rect x="15" y="50" width="970" height="240" rx="12" fill="#f4f4f4" stroke="#1f3a5f" stroke-width="1.5"/>
  <text x="30" y="78" font-size="16" font-weight="bold" fill="#1f3a5f">TRAINING PHASE (learning from examples)</text>

  <g font-size="14" fill="#1f3a5f" text-anchor="middle">
    <rect x="30" y="105" width="160" height="70" rx="8" fill="#d4eeea" stroke="#2a9d8f" stroke-width="2"/>
    <text x="110" y="135" font-size="15" font-weight="bold">1. Collect data</text>
    <text x="110" y="157">e.g. 10,000 emails</text>

    <rect x="220" y="105" width="160" height="70" rx="8" fill="#d4eeea" stroke="#2a9d8f" stroke-width="2"/>
    <text x="300" y="135" font-size="15" font-weight="bold">2. Prepare</text>
    <text x="300" y="157">features + labels</text>

    <rect x="410" y="105" width="160" height="70" rx="8" fill="#d4eeea" stroke="#2a9d8f" stroke-width="2"/>
    <text x="490" y="135" font-size="15" font-weight="bold">3. Train</text>
    <text x="490" y="157">learning algorithm</text>

    <rect x="600" y="105" width="160" height="70" rx="8" fill="#f8ebc4" stroke="#c9a227" stroke-width="2"/>
    <text x="680" y="135" font-size="15" font-weight="bold">4. Model</text>
    <text x="680" y="157">learned patterns</text>

    <rect x="790" y="105" width="160" height="70" rx="8" fill="#d4eeea" stroke="#2a9d8f" stroke-width="2"/>
    <text x="870" y="135" font-size="15" font-weight="bold">5. Test / evaluate</text>
    <text x="870" y="157">on unseen test data</text>
  </g>

  <g stroke="#1f3a5f" stroke-width="2" marker-end="url(#arr)">
    <line x1="190" y1="140" x2="218" y2="140"/>
    <line x1="380" y1="140" x2="408" y2="140"/>
    <line x1="570" y1="140" x2="598" y2="140"/>
    <line x1="760" y1="140" x2="788" y2="140"/>
  </g>

  <!-- Loop back if poor -->
  <path d="M840,175 L840,225 L110,225 L110,178" fill="none" stroke="#e76f51" stroke-width="2.5" stroke-dasharray="7 5" marker-end="url(#arrC)"/>
  <text x="475" y="252" font-size="15" fill="#1f3a5f" text-anchor="middle"><tspan font-weight="bold" fill="#e76f51">Results poor?</tspan> Improve the data or settings, then train again.</text>

  <!-- ===== Inference phase band ===== -->
  <rect x="15" y="305" width="970" height="180" rx="12" fill="#f4f4f4" stroke="#2a9d8f" stroke-width="1.5"/>
  <text x="30" y="333" font-size="16" font-weight="bold" fill="#1f3a5f">INFERENCE PHASE (using the model)</text>

  <!-- Deploy arrow -->
  <path d="M920,175 L920,352 L500,352 L500,388" fill="none" stroke="#2a9d8f" stroke-width="2.5" marker-end="url(#arrT)"/>
  <rect x="610" y="333" width="230" height="22" fill="#f4f4f4"/>
  <text x="725" y="349" font-size="15" fill="#1f3a5f" text-anchor="middle"><tspan font-weight="bold" fill="#2a9d8f">Good enough?</tspan> Deploy the model</text>

  <g font-size="14" fill="#1f3a5f" text-anchor="middle">
    <rect x="60" y="390" width="200" height="70" rx="8" fill="#ffffff" stroke="#1f3a5f" stroke-width="2"/>
    <text x="160" y="420" font-size="15" font-weight="bold">New input</text>
    <text x="160" y="442">e.g. a new email</text>

    <rect x="400" y="390" width="200" height="70" rx="8" fill="#f8ebc4" stroke="#c9a227" stroke-width="2"/>
    <text x="500" y="420" font-size="15" font-weight="bold">Trained model</text>
    <text x="500" y="442">(the same model)</text>

    <rect x="740" y="390" width="200" height="70" rx="8" fill="#f6d0c4" stroke="#e76f51" stroke-width="2"/>
    <text x="840" y="420" font-size="15" font-weight="bold">Prediction</text>
    <text x="840" y="442">e.g. "spam"</text>
  </g>
  <g stroke="#1f3a5f" stroke-width="2" marker-end="url(#arr)">
    <line x1="260" y1="425" x2="398" y2="425"/>
    <line x1="600" y1="425" x2="738" y2="425"/>
  </g>

  <text x="30" y="518" font-size="15" fill="#1f3a5f">Training is done once (or now and then). Inference happens every time someone uses the model.</text>
</svg>
