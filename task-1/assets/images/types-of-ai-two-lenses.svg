<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="660" viewBox="0 0 1000 660" role="img" aria-labelledby="title desc" font-family="Helvetica, Arial, sans-serif">
  <title id="title">Types of AI seen through two different lenses</title>
  <desc id="desc">Two separate classifications of AI. Lens 1, by capability: narrow AI (exists today), general AI or AGI (hypothetical), and superintelligence or ASI (speculative). Lens 2, by functionality: reactive machines such as Deep Blue (exist today), limited memory systems such as self-driving car perception and chatbots (exist today), theory of mind (hypothetical, a research goal) and self-aware AI (hypothetical). A coral line in each panel marks where today's AI ends. A note says all AI that exists today is narrow AI and that the functionality scheme is a popular-press taxonomy, not a formal scientific standard.</desc>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1f3a5f"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1000" height="660" fill="#ffffff"/>

  <text x="30" y="40" font-size="24" font-weight="bold" fill="#1f3a5f">Types of AI: two different lenses</text>
  <text x="30" y="66" font-size="15" fill="#1f3a5f">These are two separate ways of sorting AI, not one ladder. The same system can be described with both.</text>

  <!-- ================= Lens 1: capability ================= -->
  <rect x="20" y="85" width="960" height="215" rx="12" fill="#ffffff" stroke="#1f3a5f" stroke-width="1.5"/>
  <text x="40" y="115" font-size="19" font-weight="bold" fill="#1f3a5f">Lens 1: By capability <tspan font-weight="normal" font-size="16">(how broad is its ability?)</tspan></text>

  <!-- A1 -->
  <rect x="50" y="135" width="270" height="122" rx="10" fill="#d4eeea" stroke="#2a9d8f" stroke-width="2.5"/>
  <text x="185" y="164" font-size="17" font-weight="bold" fill="#1f3a5f" text-anchor="middle">Narrow AI (ANI)</text>
  <text x="185" y="189" font-size="14" fill="#1f3a5f" text-anchor="middle">Does one task or a narrow set of</text>
  <text x="185" y="207" font-size="14" fill="#1f3a5f" text-anchor="middle">tasks, e.g. chatbots, spam filters</text>
  <rect x="125" y="221" width="120" height="24" rx="12" fill="#2a9d8f"/>
  <text x="185" y="238" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">EXISTS TODAY</text>

  <!-- A2 -->
  <rect x="365" y="135" width="270" height="122" rx="10" fill="#f4f4f4" stroke="#8a9bb0" stroke-width="2.5" stroke-dasharray="7 5"/>
  <text x="500" y="164" font-size="17" font-weight="bold" fill="#1f3a5f" text-anchor="middle">General AI (AGI)</text>
  <text x="500" y="189" font-size="14" fill="#1f3a5f" text-anchor="middle">Would match humans across</text>
  <text x="500" y="207" font-size="14" fill="#1f3a5f" text-anchor="middle">most thinking tasks</text>
  <rect x="440" y="221" width="120" height="24" rx="12" fill="#ffffff" stroke="#8a9bb0" stroke-width="1.5"/>
  <text x="500" y="238" font-size="14" font-weight="bold" fill="#1f3a5f" text-anchor="middle">HYPOTHETICAL</text>

  <!-- A3 -->
  <rect x="680" y="135" width="270" height="122" rx="10" fill="#f4f4f4" stroke="#8a9bb0" stroke-width="2.5" stroke-dasharray="7 5"/>
  <text x="815" y="164" font-size="17" font-weight="bold" fill="#1f3a5f" text-anchor="middle">Superintelligence (ASI)</text>
  <text x="815" y="189" font-size="14" fill="#1f3a5f" text-anchor="middle">Would far exceed humans in</text>
  <text x="815" y="207" font-size="14" fill="#1f3a5f" text-anchor="middle">almost every area</text>
  <rect x="755" y="221" width="120" height="24" rx="12" fill="#ffffff" stroke="#8a9bb0" stroke-width="1.5"/>
  <text x="815" y="238" font-size="14" font-weight="bold" fill="#1f3a5f" text-anchor="middle">SPECULATIVE</text>

  <g stroke="#1f3a5f" stroke-width="2" marker-end="url(#arr)">
    <line x1="322" y1="160" x2="362" y2="160"/>
    <line x1="637" y1="160" x2="677" y2="160"/>
  </g>
  <!-- Today line, lens 1 -->
  <line x1="342" y1="130" x2="342" y2="266" stroke="#e76f51" stroke-width="3"/>
  <text x="335" y="285" font-size="14" font-weight="bold" fill="#e76f51" text-anchor="end">← exists today</text>
  <text x="349" y="285" font-size="14" font-weight="bold" fill="#e76f51">not built yet →</text>

  <!-- ================= Lens 2: functionality ================= -->
  <rect x="20" y="318" width="960" height="250" rx="12" fill="#ffffff" stroke="#1f3a5f" stroke-width="1.5"/>
  <text x="40" y="348" font-size="19" font-weight="bold" fill="#1f3a5f">Lens 2: By functionality <tspan font-weight="normal" font-size="16">(how does it use memory and understanding?)</tspan></text>

  <!-- B1 -->
  <rect x="40" y="366" width="210" height="160" rx="10" fill="#d4eeea" stroke="#2a9d8f" stroke-width="2.5"/>
  <text x="145" y="393" font-size="17" font-weight="bold" fill="#1f3a5f" text-anchor="middle">Reactive machines</text>
  <text x="145" y="418" font-size="14" fill="#1f3a5f" text-anchor="middle">No memory: reacts only</text>
  <text x="145" y="436" font-size="14" fill="#1f3a5f" text-anchor="middle">to what it sees now</text>
  <text x="145" y="460" font-size="14" font-style="italic" fill="#1f3a5f" text-anchor="middle">e.g. Deep Blue (1997)</text>
  <rect x="85" y="490" width="120" height="24" rx="12" fill="#2a9d8f"/>
  <text x="145" y="507" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">EXISTS TODAY</text>

  <!-- B2 -->
  <rect x="276" y="366" width="210" height="160" rx="10" fill="#d4eeea" stroke="#2a9d8f" stroke-width="2.5"/>
  <text x="381" y="393" font-size="17" font-weight="bold" fill="#1f3a5f" text-anchor="middle">Limited memory</text>
  <text x="381" y="418" font-size="14" fill="#1f3a5f" text-anchor="middle">Uses recent observations</text>
  <text x="381" y="436" font-size="14" fill="#1f3a5f" text-anchor="middle">while it works</text>
  <text x="381" y="460" font-size="14" font-style="italic" fill="#1f3a5f" text-anchor="middle">e.g. self-driving car</text>
  <text x="381" y="478" font-size="14" font-style="italic" fill="#1f3a5f" text-anchor="middle">perception, chatbots</text>
  <rect x="321" y="490" width="120" height="24" rx="12" fill="#2a9d8f"/>
  <text x="381" y="507" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">EXISTS TODAY</text>

  <!-- B3 -->
  <rect x="512" y="366" width="210" height="160" rx="10" fill="#f4f4f4" stroke="#8a9bb0" stroke-width="2.5" stroke-dasharray="7 5"/>
  <text x="617" y="393" font-size="17" font-weight="bold" fill="#1f3a5f" text-anchor="middle">Theory of mind</text>
  <text x="617" y="418" font-size="14" fill="#1f3a5f" text-anchor="middle">Would understand others'</text>
  <text x="617" y="436" font-size="14" fill="#1f3a5f" text-anchor="middle">feelings and beliefs</text>
  <text x="617" y="460" font-size="14" font-style="italic" fill="#1f3a5f" text-anchor="middle">a research goal only</text>
  <rect x="557" y="490" width="120" height="24" rx="12" fill="#ffffff" stroke="#8a9bb0" stroke-width="1.5"/>
  <text x="617" y="507" font-size="14" font-weight="bold" fill="#1f3a5f" text-anchor="middle">HYPOTHETICAL</text>

  <!-- B4 -->
  <rect x="748" y="366" width="210" height="160" rx="10" fill="#f4f4f4" stroke="#8a9bb0" stroke-width="2.5" stroke-dasharray="7 5"/>
  <text x="853" y="393" font-size="17" font-weight="bold" fill="#1f3a5f" text-anchor="middle">Self-aware AI</text>
  <text x="853" y="418" font-size="14" fill="#1f3a5f" text-anchor="middle">Would have its own</text>
  <text x="853" y="436" font-size="14" fill="#1f3a5f" text-anchor="middle">consciousness and</text>
  <text x="853" y="454" font-size="14" fill="#1f3a5f" text-anchor="middle">sense of self</text>
  <rect x="793" y="490" width="120" height="24" rx="12" fill="#ffffff" stroke="#8a9bb0" stroke-width="1.5"/>
  <text x="853" y="507" font-size="14" font-weight="bold" fill="#1f3a5f" text-anchor="middle">HYPOTHETICAL</text>

  <g stroke="#1f3a5f" stroke-width="2" marker-end="url(#arr)">
    <line x1="251" y1="390" x2="274" y2="390"/>
    <line x1="487" y1="390" x2="510" y2="390"/>
    <line x1="723" y1="390" x2="746" y2="390"/>
  </g>
  <!-- Today line, lens 2 -->
  <line x1="499" y1="360" x2="499" y2="534" stroke="#e76f51" stroke-width="3"/>
  <text x="492" y="553" font-size="14" font-weight="bold" fill="#e76f51" text-anchor="end">← exists today</text>
  <text x="506" y="553" font-size="14" font-weight="bold" fill="#e76f51">not built yet →</text>

  <!-- Notes -->
  <text x="30" y="600" font-size="15" fill="#1f3a5f"><tspan font-weight="bold">Key point:</tspan> all AI that exists today is narrow AI, working as reactive or limited-memory systems.</text>
  <text x="30" y="626" font-size="14" fill="#1f3a5f" font-style="italic">The functionality lens is a popular-press taxonomy (e.g. Hintze, 2016), not a formal scientific standard.</text>
</svg>
