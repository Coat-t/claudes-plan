<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="580" viewBox="0 0 1000 580" role="img" aria-labelledby="title desc" font-family="Helvetica, Arial, sans-serif">
  <title id="title">Next-token prediction in a large language model</title>
  <desc id="desc">The prompt "The cat sat on the" goes into a language model, which gives a probability for each possible next token. Illustrative (made-up) numbers: mat 0.41, floor 0.17, sofa 0.12, roof 0.06, all other tokens together 0.24. One token is chosen, here "mat", and appended to give "The cat sat on the mat". The longer text then becomes the new input and the process repeats, one token at a time.</desc>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1f3a5f"/>
    </marker>
    <marker id="arrC" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#e76f51"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1000" height="580" fill="#ffffff"/>

  <text x="30" y="40" font-size="24" font-weight="bold" fill="#1f3a5f">How a language model writes: one token at a time</text>
  <text x="30" y="66" font-size="15" fill="#1f3a5f">The model scores every possible next token, picks one, adds it to the text, and repeats.</text>

  <!-- Step 1: prompt -->
  <text x="40" y="112" font-size="14" font-weight="bold" fill="#2a9d8f">STEP 1: INPUT (PROMPT)</text>
  <rect x="40" y="124" width="240" height="60" rx="10" fill="#d4eeea" stroke="#2a9d8f" stroke-width="2.5"/>
  <text x="160" y="161" font-size="20" fill="#1f3a5f" text-anchor="middle">The cat sat on the</text>

  <line x1="280" y1="154" x2="338" y2="154" stroke="#1f3a5f" stroke-width="2.5" marker-end="url(#arr)"/>

  <!-- Step 2: model -->
  <text x="340" y="112" font-size="14" font-weight="bold" fill="#2a9d8f">STEP 2: MODEL</text>
  <rect x="340" y="124" width="190" height="60" rx="10" fill="#1f3a5f"/>
  <text x="435" y="151" font-size="17" font-weight="bold" fill="#ffffff" text-anchor="middle">Language model</text>
  <text x="435" y="172" font-size="14" fill="#ffffff" text-anchor="middle">(a neural network)</text>

  <line x1="530" y1="154" x2="578" y2="154" stroke="#1f3a5f" stroke-width="2.5" marker-end="url(#arr)"/>

  <!-- Step 3: probabilities (bar chart) -->
  <rect x="580" y="90" width="390" height="275" rx="10" fill="#f4f4f4" stroke="#1f3a5f" stroke-width="1.5"/>
  <text x="600" y="117" font-size="14" font-weight="bold" fill="#2a9d8f">STEP 3: PROBABILITY OF EACH NEXT TOKEN</text>
  <g font-size="16" fill="#1f3a5f">
    <text x="660" y="152" text-anchor="end" font-weight="bold">mat</text>
    <rect x="670" y="134" width="221" height="26" fill="#e76f51"/>
    <text x="899" y="152" font-weight="bold">0.41</text>

    <text x="660" y="194" text-anchor="end">floor</text>
    <rect x="670" y="176" width="92" height="26" fill="#2a9d8f"/>
    <text x="770" y="194">0.17</text>

    <text x="660" y="236" text-anchor="end">sofa</text>
    <rect x="670" y="218" width="65" height="26" fill="#2a9d8f"/>
    <text x="743" y="236">0.12</text>

    <text x="660" y="278" text-anchor="end">roof</text>
    <rect x="670" y="260" width="32" height="26" fill="#2a9d8f"/>
    <text x="710" y="278">0.06</text>

    <text x="660" y="320" text-anchor="end">other</text>
    <rect x="670" y="302" width="130" height="26" fill="#8a9bb0"/>
    <text x="808" y="320">0.24</text>
  </g>
  <line x1="670" y1="128" x2="670" y2="334" stroke="#1f3a5f" stroke-width="1.5"/>
  <text x="600" y="352" font-size="14" fill="#1f3a5f">"other" = all remaining tokens together. Total = 1.00</text>

  <!-- Choose token -->
  <path d="M780,365 L780,430 L702,430" fill="none" stroke="#e76f51" stroke-width="2.5" marker-end="url(#arrC)"/>
  <text x="792" y="404" font-size="15" fill="#1f3a5f"><tspan font-weight="bold">STEP 4:</tspan> pick a token</text>
  <text x="792" y="423" font-size="14" fill="#1f3a5f">(usually a likely one; some</text>
  <text x="792" y="441" font-size="14" fill="#1f3a5f">randomness adds variety)</text>

  <!-- Step 5: appended output -->
  <rect x="380" y="400" width="320" height="60" rx="10" fill="#f6d0c4" stroke="#e76f51" stroke-width="2.5"/>
  <text x="540" y="437" font-size="20" fill="#1f3a5f" text-anchor="middle">The cat sat on the <tspan font-weight="bold" fill="#c4472a">mat</tspan></text>
  <text x="540" y="482" font-size="14" fill="#1f3a5f" text-anchor="middle"><tspan font-weight="bold">STEP 5:</tspan> the chosen token is added to the text</text>

  <!-- Repeat loop -->
  <path d="M380,430 L160,430 L160,188" fill="none" stroke="#1f3a5f" stroke-width="2.5" stroke-dasharray="8 5" marker-end="url(#arr)"/>
  <text x="176" y="300" font-size="17" font-weight="bold" fill="#1f3a5f">repeat</text>
  <text x="176" y="320" font-size="14" fill="#1f3a5f">the longer text becomes</text>
  <text x="176" y="338" font-size="14" fill="#1f3a5f">the new input, until the</text>
  <text x="176" y="356" font-size="14" fill="#1f3a5f">answer is complete</text>

  <!-- Footnote -->
  <rect x="30" y="510" width="940" height="50" rx="10" fill="#f8ebc4" stroke="#c9a227" stroke-width="2"/>
  <text x="500" y="531" font-size="15" font-weight="bold" fill="#1f3a5f" text-anchor="middle">Illustrative (made-up) numbers.</text>
  <text x="500" y="550" font-size="14" fill="#1f3a5f" text-anchor="middle">A real model scores tens of thousands of possible tokens; a token can be a word or part of a word.</text>
</svg>
