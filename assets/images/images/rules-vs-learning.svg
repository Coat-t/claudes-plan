<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560" viewBox="0 0 1000 560" role="img" aria-labelledby="title desc" font-family="Helvetica, Arial, sans-serif">
  <title id="title">Traditional programming versus machine learning</title>
  <desc id="desc">Two rows. Top row, traditional programming: a person writes the rules; rules plus data go into a program, which produces answers. Bottom row, machine learning: data plus answers (labelled examples) go into a learning algorithm, which produces rules in the form of a model. Spam-filter examples are given for both rows.</desc>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1f3a5f"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1000" height="560" fill="#ffffff"/>

  <text x="40" y="44" font-size="24" font-weight="bold" fill="#1f3a5f">Traditional programming vs machine learning</text>
  <text x="40" y="70" font-size="15" fill="#1f3a5f">Same parts, different direction: in machine learning the computer works out the rules from examples.</text>

  <!-- ===== Row 1: traditional programming ===== -->
  <rect x="20" y="90" width="960" height="210" rx="12" fill="#f4f4f4" stroke="#1f3a5f" stroke-width="1.5"/>
  <text x="40" y="120" font-size="19" font-weight="bold" fill="#1f3a5f">Traditional programming</text>

  <rect x="60" y="138" width="210" height="52" rx="8" fill="#f8ebc4" stroke="#c9a227" stroke-width="2"/>
  <text x="165" y="170" font-size="18" font-weight="bold" fill="#1f3a5f" text-anchor="middle">Rules</text>
  <rect x="60" y="206" width="210" height="52" rx="8" fill="#d4eeea" stroke="#2a9d8f" stroke-width="2"/>
  <text x="165" y="238" font-size="18" font-weight="bold" fill="#1f3a5f" text-anchor="middle">Data</text>

  <path d="M270,164 L320,164 L320,198 L370,198" fill="none" stroke="#1f3a5f" stroke-width="2" marker-end="url(#arr)"/>
  <path d="M270,232 L320,232 L320,198" fill="none" stroke="#1f3a5f" stroke-width="2"/>

  <rect x="372" y="156" width="250" height="84" rx="10" fill="#1f3a5f"/>
  <text x="497" y="192" font-size="18" font-weight="bold" fill="#ffffff" text-anchor="middle">Program</text>
  <text x="497" y="216" font-size="15" fill="#ffffff" text-anchor="middle">follows the rules</text>

  <line x1="622" y1="198" x2="712" y2="198" stroke="#1f3a5f" stroke-width="2" marker-end="url(#arr)"/>

  <rect x="715" y="172" width="230" height="52" rx="8" fill="#f6d0c4" stroke="#e76f51" stroke-width="2"/>
  <text x="830" y="204" font-size="18" font-weight="bold" fill="#1f3a5f" text-anchor="middle">Answers</text>

  <text x="40" y="285" font-size="15" fill="#1f3a5f" font-style="italic">Spam example: a person writes "if the subject says FREE MONEY, mark as spam"; the program applies it to each email.</text>

  <!-- ===== Row 2: machine learning ===== -->
  <rect x="20" y="320" width="960" height="210" rx="12" fill="#f4f4f4" stroke="#2a9d8f" stroke-width="1.5"/>
  <text x="40" y="350" font-size="19" font-weight="bold" fill="#1f3a5f">Machine learning</text>

  <rect x="60" y="368" width="210" height="52" rx="8" fill="#d4eeea" stroke="#2a9d8f" stroke-width="2"/>
  <text x="165" y="400" font-size="18" font-weight="bold" fill="#1f3a5f" text-anchor="middle">Data</text>
  <rect x="60" y="436" width="210" height="52" rx="8" fill="#f6d0c4" stroke="#e76f51" stroke-width="2"/>
  <text x="165" y="460" font-size="18" font-weight="bold" fill="#1f3a5f" text-anchor="middle">Answers</text>
  <text x="165" y="480" font-size="14" fill="#1f3a5f" text-anchor="middle">(labelled examples)</text>

  <path d="M270,394 L320,394 L320,428 L370,428" fill="none" stroke="#1f3a5f" stroke-width="2" marker-end="url(#arr)"/>
  <path d="M270,462 L320,462 L320,428" fill="none" stroke="#1f3a5f" stroke-width="2"/>

  <rect x="372" y="386" width="250" height="84" rx="10" fill="#2a9d8f"/>
  <text x="497" y="422" font-size="18" font-weight="bold" fill="#ffffff" text-anchor="middle">Learning algorithm</text>
  <text x="497" y="446" font-size="15" fill="#ffffff" text-anchor="middle">finds patterns (training)</text>

  <line x1="622" y1="428" x2="712" y2="428" stroke="#1f3a5f" stroke-width="2" marker-end="url(#arr)"/>

  <rect x="715" y="402" width="230" height="52" rx="8" fill="#f8ebc4" stroke="#c9a227" stroke-width="2"/>
  <text x="830" y="426" font-size="18" font-weight="bold" fill="#1f3a5f" text-anchor="middle">Rules</text>
  <text x="830" y="446" font-size="14" fill="#1f3a5f" text-anchor="middle">(a model)</text>

  <text x="40" y="515" font-size="15" fill="#1f3a5f" font-style="italic">Spam example: thousands of emails already labelled "spam" or "not spam" go in; a spam-filter model comes out.</text>
</svg>
