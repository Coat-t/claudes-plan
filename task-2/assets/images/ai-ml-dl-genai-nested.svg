<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="740" viewBox="0 0 1000 740" role="img" aria-labelledby="title desc" font-family="Helvetica, Arial, sans-serif">
  <title id="title">How AI, machine learning, deep learning and generative AI fit together</title>
  <desc id="desc">Four nested circles. The outer circle is artificial intelligence (example: a rule-based chess program). Inside it is machine learning (example: a spam filter). Inside that is deep learning (example: face recognition). The innermost circle is generative AI (example: a chatbot or image generator). A footnote says this is a simplification: almost all of today's prominent generative AI uses deep learning, but some older generative methods did not.</desc>
  <rect x="0" y="0" width="1000" height="740" fill="#ffffff"/>

  <!-- Heading -->
  <text x="40" y="44" font-size="24" font-weight="bold" fill="#1f3a5f">AI, machine learning, deep learning and generative AI</text>
  <text x="40" y="70" font-size="15" fill="#1f3a5f">Each circle is a part (subset) of the circle around it.</text>

  <!-- Nested circles -->
  <circle cx="300" cy="380" r="290" fill="#dfe7f1" stroke="#1f3a5f" stroke-width="3"/>
  <circle cx="300" cy="440" r="225" fill="#d4eeea" stroke="#2a9d8f" stroke-width="3"/>
  <circle cx="300" cy="500" r="160" fill="#f8ebc4" stroke="#c9a227" stroke-width="3"/>
  <circle cx="300" cy="565" r="95" fill="#f6d0c4" stroke="#e76f51" stroke-width="3"/>

  <!-- Circle labels -->
  <text x="300" y="140" font-size="21" font-weight="bold" fill="#1f3a5f" text-anchor="middle">Artificial intelligence</text>
  <text x="300" y="163" font-size="16" fill="#1f3a5f" text-anchor="middle">(AI)</text>
  <text x="300" y="262" font-size="20" font-weight="bold" fill="#1f3a5f" text-anchor="middle">Machine learning</text>
  <text x="300" y="284" font-size="16" fill="#1f3a5f" text-anchor="middle">(ML)</text>
  <text x="300" y="390" font-size="20" font-weight="bold" fill="#1f3a5f" text-anchor="middle">Deep learning</text>
  <text x="300" y="412" font-size="16" fill="#1f3a5f" text-anchor="middle">(DL)</text>
  <text x="300" y="560" font-size="18" font-weight="bold" fill="#1f3a5f" text-anchor="middle">Generative AI</text>
  <text x="300" y="582" font-size="16" fill="#1f3a5f" text-anchor="middle">(GenAI)</text>

  <!-- Key cards -->
  <g font-size="15" fill="#1f3a5f">
    <rect x="620" y="100" width="350" height="122" rx="10" fill="#f4f4f4" stroke="#1f3a5f" stroke-width="2"/>
    <circle cx="645" cy="126" r="10" fill="#dfe7f1" stroke="#1f3a5f" stroke-width="2"/>
    <text x="665" y="132" font-size="17" font-weight="bold">Artificial intelligence</text>
    <text x="640" y="160">Computers doing tasks that we link</text>
    <text x="640" y="180">with human intelligence.</text>
    <text x="640" y="206" font-style="italic">Example: a rule-based chess program</text>

    <rect x="620" y="236" width="350" height="122" rx="10" fill="#f4f4f4" stroke="#2a9d8f" stroke-width="2"/>
    <circle cx="645" cy="262" r="10" fill="#d4eeea" stroke="#2a9d8f" stroke-width="2"/>
    <text x="665" y="268" font-size="17" font-weight="bold">Machine learning</text>
    <text x="640" y="296">AI that learns patterns from</text>
    <text x="640" y="316">examples instead of fixed rules.</text>
    <text x="640" y="342" font-style="italic">Example: a spam filter</text>

    <rect x="620" y="372" width="350" height="122" rx="10" fill="#f4f4f4" stroke="#c9a227" stroke-width="2"/>
    <circle cx="645" cy="398" r="10" fill="#f8ebc4" stroke="#c9a227" stroke-width="2"/>
    <text x="665" y="404" font-size="17" font-weight="bold">Deep learning</text>
    <text x="640" y="432">Machine learning that uses neural</text>
    <text x="640" y="452">networks with many layers.</text>
    <text x="640" y="478" font-style="italic">Example: face recognition</text>

    <rect x="620" y="508" width="350" height="122" rx="10" fill="#f4f4f4" stroke="#e76f51" stroke-width="2"/>
    <circle cx="645" cy="534" r="10" fill="#f6d0c4" stroke="#e76f51" stroke-width="2"/>
    <text x="665" y="540" font-size="17" font-weight="bold">Generative AI</text>
    <text x="640" y="568">Models that create new content:</text>
    <text x="640" y="588">text, images, audio or code.</text>
    <text x="640" y="614" font-style="italic">Example: a chatbot / image generator</text>
  </g>

  <!-- Footnote -->
  <text x="40" y="712" font-size="14" fill="#1f3a5f">Simplification: almost all of today's prominent generative AI uses deep learning; some older generative methods did not.</text>
</svg>
